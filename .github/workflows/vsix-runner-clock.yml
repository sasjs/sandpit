name: Runner clock adversarial timestamp probe
on:
  push:
    branches: [experiment/vsix-runner-clock-20261123]
permissions: {}
jobs:
  producer:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Shift hosted guest clock forward before next step
        run: |
          set -euo pipefail
          before=$(date -u +%s)
          printf '%s\n' "$before" > /tmp/probe-original-clock
          sudo date -u -s "@$((before + 600))"
          date -u
      - name: Execute with advanced clock and restore guest time
        run: |
          set -euo pipefail
          before=$(< /tmp/probe-original-clock)
          trap 'sudo date -u -s "@$before"' EXIT
          date -u
          sleep 2
      - name: Report restored time
        run: date -u
  check:
    needs: producer
    runs-on: ubuntu-latest
    permissions: {actions: read}
    steps:
      - name: Check producer API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq '{run_started_at,run_attempt}'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[]|select(.name=="producer")|{id,started_at,completed_at,steps}'
